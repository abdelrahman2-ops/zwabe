paths:
  # Root Endpoint
  /:
    get:
      tags:
        - General
      summary: API Root - Health Check
      description: |
        Root endpoint for API health check and welcome message. 
        This endpoint can be used to verify that the API is running and accessible.
        
        **Success Response:**
        ```json
        {
          "message": "مرحباً بك في API نظام الحجز السياحي - ذهاب وإياب",
          "version": "1.0.0",
          "status": "running",
          "timestamp": "2023-05-28T10:15:30.000Z",
          "documentation": "http://192.168.1.4:3000/api-docs"
        }
        ```
      responses:
        '200':
          description: API is running successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: مرحباً بك في API نظام الحجز السياحي - ذهاب وإياب
                    description: Welcome message in Arabic
                  version:
                    type: string
                    example: 1.0.0
                    description: API version
                  status:
                    type: string
                    example: running
                    description: API status
                  timestamp:
                    type: string
                    format: date-time
                    example: 2023-05-28T10:15:30.000Z
                    description: Current server timestamp
                  documentation:
                    type: string
                    example: http://192.168.1.4:3000/api-docs
                    description: Link to API documentation
              examples:
                api_root:
                  summary: API root response
                  value:
                    message: مرحباً بك في API نظام الحجز السياحي - ذهاب وإياب
                    version: 1.0.0
                    status: running
                    timestamp: 2023-05-28T10:15:30.000Z
                    documentation: http://192.168.1.4:3000/api-docs

  # Authentication Endpoints
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: |
        Authenticate user credentials and receive JWT token for API access.
        
        **Request Body:**
        ```json
        {
          "email": "admin@zahabwaawda.com",
          "password": "SecurePassword123!"
        }
        ```
        
        **Success Response:**
        ```json
        {
          "status": "success",
          "message": "Login successful",
          "data": {
            "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
            "user": {
              "_id": "6472f8b8ef4f160023ed47fe",
              "name": "Admin User",
              "email": "admin@zahabwaawda.com",
              "role": "admin",
              "isActive": true,
              "createdAt": "2023-05-28T10:15:30.000Z",
              "updatedAt": "2023-05-28T10:15:30.000Z"
            }
          }
        }
        ```
      requestBody:
        required: true
