  # Packages Endpoints
  /packages:
    get:
      tags:
        - Packages
      summary: Get all travel packages
      description: |
        Retrieve list of all travel packages with complete details including itinerary, pricing, and location information. Public endpoint.
        
        **Query Parameters:**
        - `page` (optional): Page number (default: 1)
        - `limit` (optional): Items per page (default: 10)
        - `sort` (optional): Sort by price, rating, or date (e.g., `price`, `-rating`, `-createdAt`)
        - `country` (optional): Filter by country ID
        - `city` (optional): Filter by city ID
        - `packageType` (optional): Filter by package type ID
        - `price[gte]` (optional): Minimum price filter
        - `price[lte]` (optional): Maximum price filter
        
        **Success Response:**
        ```json
        {
          "status": "success", 
          "message": "Packages retrieved successfully",
          "data": {
            "packages": [
              {
                "_id": "647package123abc456789012680",
                "name": "رحلة العمرة المميزة - 7 أيام",
                "price": 2500,
                "rate": 4.8,
                "header": {
                  "dayNumber": 7,
                  "nights": 6,
                  "location": "647def123abc456789012678"
                },
                "packageType": {
                  "_id": "647type123abc456789012681",
                  "name": "رحلات دينية"
                },
                "itinerary": [
                  {
                    "day": 1,
                    "title": "الوصول إلى مكة المكرمة", 
                    "description": "استقبال في المطار والانتقال إلى الفندق"
                  }
                ],
                "includes": [
                  "تذاكر الطيران",
                  "الإقامة في فندق 5 نجوم",
                  "وجبات الطعام",
                  "النقل والمواصلات"
                ],
                "excludes": [
                  "التأشيرة",
                  "التأمين الصحي"
                ],
                "country": {
                  "_id": "647def123abc456789012678",
                  "name": "المملكة العربية السعودية"
                },
                "city": {
                  "_id": "647city123abc456789012679", 
                  "name": "مكة المكرمة"
                },
                "imageCover": "https://res.cloudinary.com/zahabwaawda/image/upload/v1684567890/packages/umrah-package-cover.jpg",
                "slug": "umrah-package-7-days",
                "createdAt": "2023-05-28T10:15:30.000Z"
              }
            ]
          },
          "pagination": {
            "page": 1,
            "limit": 10,
            "total": 128,
            "pages": 13,
            "hasNext": true,
            "hasPrev": false
          }
        }
        ```
      parameters:
        - $ref: '#/components/parameters/PageQueryParameter'
        - $ref: '#/components/parameters/LimitQueryParameter'
        - $ref: '#/components/parameters/SortQueryParameter'
        - name: country
          in: query
          description: Filter by country ID
          schema:
            type: string
        - name: city
          in: query
          description: Filter by city ID  
          schema:
            type: string
        - name: packageType
          in: query
          description: Filter by package type ID
          schema:
            type: string
        - name: price[gte]
          in: query
          description: Minimum price filter
          schema:
            type: number
        - name: price[lte]
          in: query
          description: Maximum price filter
          schema:
            type: number
      responses:
        '200':
          description: Packages retrieved successfully with full details and pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackagesListResponse'
              examples:
                packages_list:
                  summary: List of travel packages with details
                  value:
                    status: success
                    message: Packages retrieved successfully
                    data:
                      packages:
                        - _id: 647package123abc456789012680
                          name: رحلة العمرة المميزة - 7 أيام
                          price: 2500
                          rate: 4.8
                          packageType:
                            _id: 647type123abc456789012681
                            name: رحلات دينية
                          country:
                            _id: 647def123abc456789012678
                            name: المملكة العربية السعودية
                          city:
                            _id: 647city123abc456789012679
                            name: مكة المكرمة
                          imageCover: https://res.cloudinary.com/zahabwaawda/image/upload/v1684567890/packages/umrah-package-cover.jpg
                          slug: umrah-package-7-days
                          includes: ["تذاكر الطيران", "الإقامة في فندق 5 نجوم"]
                          excludes: ["التأشيرة", "التأمين الصحي"]
                          createdAt: 2023-05-28T10:15:30.000Z
                    pagination:
                      page: 1
                      limit: 10
                      total: 128
                      pages: 13
                      hasNext: true
                      hasPrev: false
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Package'

    post:
      tags:
        - Packages
      summary: Create package (Admin/Manager/Data-Entry)
