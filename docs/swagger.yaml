# Travel Booking System API - Complete Documentation
# 
# This OpenAPI 3.0 specification provides comprehensive documentation for the Travel Booking System API.
# It includes detailed request/response examples, proper data structures, and complete endpoint documentation.
# 
# Key Features:
# - JWT-based authentication with role-based access control (user, admin, manager, data-entry)
# - Complete CRUD operations for all travel-related resources
# - File upload support for images via multipart/form-data
# - Advanced filtering, sorting, and pagination
# - SEO-optimized content management
# - Comprehensive error handling and validation
# 
# Authentication Flow:
# 1. POST /auth/login - Get JWT token
# 2. Include token in Authorization header: "Bearer <token>"
# 3. Access protected endpoints based on user role
# 
# Response Format:
# All successful responses follow the format:
# {
#   "status": "success",
#   "message": "Operation description",
#   "data": { /* actual data */ },
#   "pagination": { /* for list endpoints */ }
# }

openapi: 3.0.0
info:
  title: Travel Booking System API
  description: |
    Complete Travel Booking System API for "Zahab wa Awda" platform.
    
    **Features:**
    - Multi-language support (Arabic/English)
    - Role-based authentication system
    - Image upload and processing
    - SEO optimization for all content
    - Advanced search and filtering
    - Real-time booking management
    
    **Base URL:** http://192.168.1.4:3000/api/v1
    
    **Authentication:** JWT Bearer Token required for protected endpoints
  version: 1.0.0
  contact:
    name: Zahab wa Awda API Support
    email: support@zahabwaawda.com
    url: https://zahabwaawda.com

servers:
  - url: http://192.168.1.4:3000/api/v1
    description: Development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    # Authentication Schemas
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@zahabwaawda.com
          description: User's email address for authentication
        password:
          type: string
          example: SecurePassword123!
          description: User's password (minimum 6 characters)
          minLength: 6
      example:
        email: admin@zahabwaawda.com
        password: SecurePassword123!
    
    LoginResponse:
      type: object
      properties:
        status:
          type: string
          example: success
          description: Response status indicator
        message:
          type: string
          example: Login successful
          description: Success message
        data:
          type: object
          properties:
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjY0NzJmOGI4ZWY0ZjE2MDAyM2VkNDdmZSIsImlhdCI6MTY4NTI3NzM2OCwiZXhwIjoxNjkzMDUzMzY4fQ.xyz123
              description: JWT authentication token
            user:
              $ref: '#/components/schemas/User'
      example:
        status: success
        message: Login successful
        data:
          token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjY0NzJmOGI4ZWY0ZjE2MDAyM2VkNDdmZSIsImlhdCI6MTY4NTI3NzM2OCwiZXhwIjoxNjkzMDUzMzY4fQ.xyz123
          user:
            _id: 6472f8b8ef4f160023ed47fe
            name: Admin User
            email: admin@zahabwaawda.com
            role: admin
            isActive: true
            createdAt: 2023-05-28T10:15:30.000Z
            updatedAt: 2023-05-28T10:15:30.000Z
    
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - password
        - passwordConfirm
      properties:
        currentPassword:
          type: string
        password:
          type: string
        passwordConfirm:
          type: string
    
    # User Schemas
    User:
      type: object
      properties:
        _id:
          type: string
          example: 6472f8b8ef4f160023ed47fe
          description: Unique user identifier
        name:
          type: string
          example: أحمد محمد علي
          description: User's full name (supports Arabic)
        email:
          type: string
          format: email
          example: ahmed.ali@zahabwaawda.com
          description: User's email address
        role:
          type: string
          enum: [user, admin, manager, data-entry]
          example: user
          description: User role determining access permissions
        isActive:
          type: boolean
          example: true
          description: Account activation status
        createdAt:
          type: string
          format: date-time
          example: 2023-05-28T10:15:30.000Z
          description: Account creation timestamp
        updatedAt:
          type: string
          format: date-time
          example: 2023-05-28T12:30:45.000Z
          description: Last update timestamp
      example:
        _id: 6472f8b8ef4f160023ed47fe
        name: أحمد محمد علي
        email: ahmed.ali@zahabwaawda.com
        role: user
        isActive: true
        createdAt: 2023-05-28T10:15:30.000Z
        updatedAt: 2023-05-28T12:30:45.000Z
    
    UserCreateRequest:
      type: object
      required:
        - name
        - email
        - password
        - passwordConfirm
        - role
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: johndoe@example.com
        password:
          type: string
          example: password123
        passwordConfirm:
          type: string
          example: password123
        role:
          type: string
          enum: [user, admin, manager, data-entry]
          example: user
    
    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: Updated Name
        role:
          type: string
          enum: [user, admin, manager, data-entry]
        isActive:
          type: boolean
    
    # SEO Schema
    SEO:
      type: object
      properties:
        metaTitle:
          type: string
          maxLength: 60
          example: Best Travel Deals - Skyways Airlines
        metaDescription:
          type: string
          maxLength: 160
          example: Find the best travel deals with Skyways Airlines
        keywords:
          type: string
          example: travel, flights, hotels, tours
        slugUrl:
          type: string
          example: best-travel-deals
        priority:
          type: number
          minimum: 0
          maximum: 1
          example: 0.8
        changeFrequency:
          type: string
          enum: [always, hourly, daily, weekly, monthly, yearly, never]
          example: monthly
        noIndex:
          type: boolean
          example: false
        noFollow:
          type: boolean
          example: false
        noArchive:
          type: boolean
          example: false
        noSnippet:
          type: boolean
          example: false
        ogTitle:
          type: string
          maxLength: 60
        ogDescription:
          type: string
          maxLength: 160
        ogImage:
          type: string
    
    # Airline Schemas
    Airline:
      type: object
      properties:
        _id:
          type: string
          example: 647abc123def456789012345
          description: Unique airline identifier
        name:
          type: string
          example: الخطوط الجوية السعودية
          description: Airline name (supports Arabic)
        imageCover:
          type: string
          example: https://res.cloudinary.com/zahabwaawda/image/upload/v1684567890/airlines/saudi-airlines-cover.jpg
          description: Airline logo/cover image URL
        slug:
          type: string
          example: saudi-airlines
          description: URL-friendly airline identifier
        alt:
          type: string
          example: شعار الخطوط الجوية السعودية
          description: Image alt text for accessibility
        seo:
          $ref: '#/components/schemas/SEO'
        createdBy:
          type: string
          example: 6472f8b8ef4f160023ed47fe
          description: ID of user who created this airline
        updatedBy:
          type: string
          example: 6472f8b8ef4f160023ed47fe
          description: ID of user who last updated this airline
        createdAt:
          type: string
          format: date-time
          example: 2023-05-28T10:15:30.000Z
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          example: 2023-05-28T12:30:45.000Z
          description: Last update timestamp
      example:
        _id: 647abc123def456789012345
        name: الخطوط الجوية السعودية
        imageCover: https://res.cloudinary.com/zahabwaawda/image/upload/v1684567890/airlines/saudi-airlines-cover.jpg
        slug: saudi-airlines
        alt: شعار الخطوط الجوية السعودية
        seo:
          metaTitle: الخطوط الجوية السعودية - أفضل خدمات الطيران
          metaDescription: احجز مع الخطوط الجوية السعودية واستمتع بأفضل خدمات الطيران
          keywords: الطيران, السعودية, حجز تذاكر, سفر
          slugUrl: saudi-airlines
        createdBy: 6472f8b8ef4f160023ed47fe
        updatedBy: 6472f8b8ef4f160023ed47fe
        createdAt: 2023-05-28T10:15:30.000Z
        updatedAt: 2023-05-28T12:30:45.000Z
    
    AirlineCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Skyways Airlines
        alt:
          type: string
          example: Skyways Airlines logo
        seo:
          $ref: '#/components/schemas/SEO'
        imageCover:
          type: string
          format: binary
    
    # Blog Schemas
    Blog:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
          example: أفضل الوجهات السياحية في الشرق الأوسط
        descText:
          type: string
          example: اكتشف جمال وروعة الوجهات العربية
        description:
          type: string
          example: دليل شامل لأجمل الوجهات السياحية في العالم العربي
        tags:
          type: array
          items:
            type: string
          example: ["السياحة العربية", "الشرق الأوسط", "السفر"]
        imageCover:
          type: string
        images:
          type: array
          items:
            type: string
        slug:
          type: string
        alt:
          type: string
        seo:
          $ref: '#/components/schemas/SEO'
        createdBy:
          type: string
        updatedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    BlogCreateRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        descText:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        imageCover:
          type: string
        images:
          type: array
          items:
            type: string
        alt:
          type: string
        seo:
          $ref: '#/components/schemas/SEO'
    
    # Booking Schemas
    Booking:
      type: object
      properties:
        _id:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        fromCity:
          type: string
        toCity:
          type: string
        departureDate:
          type: string
          format: date-time
        returnDate:
          type: string
          format: date-time
        passengers:
          type: integer
          minimum: 1
        slug:
          type: string
        alt:
          type: string
        seo:
          $ref: '#/components/schemas/SEO'
        createdBy:
          type: string
        updatedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    BookingCreateRequest:
      type: object
      required:
        - departureDate
        - passengers
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        fromCity:
          type: string
        toCity:
          type: string
        departureDate:
          type: string
          format: date-time
        returnDate:
          type: string
          format: date-time
        passengers:
          type: integer
          minimum: 1
        alt:
          type: string
        seo:
          $ref: '#/components/schemas/SEO'
    
    # Country Schemas
    Country:
      type: object
      properties:
        _id:
          type: string
          example: 647def123abc456789012678
          description: Unique country identifier
        name:
          type: string
          example: المملكة العربية السعودية
          description: Country name (supports Arabic)
        code:
          type: string
          example: SA
          description: ISO country code
        continent:
          type: string
          example: Asia
          description: Continent name
        currency:
          type: string
          example: SAR
          description: Country currency code
        language:
          type: string
          example: Arabic
          description: Primary language
        description:
          type: string
          example: المملكة العربية السعودية هي دولة عربية تقع في شبه الجزيرة العربية في جنوب غرب آسيا، وتعد أكبر دول الشرق الأوسط مساحة
          description: Detailed country description
        descText:
          type: string
          example: اكتشف جمال المملكة العربية السعودية مع باقاتنا السياحية المميزة
          description: Short promotional text
        favTime:
          type: array
          items:
            type: string
          example: ["الصباح الباكر", "المساء"]
          description: Recommended visiting times
        favMonth:
          type: array
          items:
            type: string
          example: ["الخريف", "الشتاء", "الربيع"]
          description: Best months to visit
        isActive:
          type: boolean
          default: true
          example: true
          description: Country availability status
        images:
          type: array
          items:
            type: string
          example: 
            - https://res.cloudinary.com/zahabwaawda/image/upload/v1684567890/countries/saudi-arabia-1.jpg
            - https://res.cloudinary.com/zahabwaawda/image/upload/v1684567890/countries/saudi-arabia-2.jpg
          description: Additional country images
        imageCover:
          type: string
          example: https://res.cloudinary.com/zahabwaawda/image/upload/v1684567890/countries/saudi-arabia-cover.jpg
          description: Main country cover image
        slug:
          type: string
          example: saudi-arabia
          description: URL-friendly identifier
        alt:
          type: string
          example: صورة المملكة العربية السعودية
          description: Image alt text
        seo:
          $ref: '#/components/schemas/SEO'
        cities:
          type: array
          items:
            $ref: '#/components/schemas/City'
          description: List of cities in this country
        createdBy:
          type: string
          example: 6472f8b8ef4f160023ed47fe
        updatedBy:
          type: string
          example: 6472f8b8ef4f160023ed47fe
        createdAt:
          type: string
          format: date-time
          example: 2023-05-28T10:15:30.000Z
        updatedAt:
          type: string
          format: date-time
          example: 2023-05-28T12:30:45.000Z
      example:
        _id: 647def123abc456789012678
        name: المملكة العربية السعودية
        code: SA
        continent: Asia
        currency: SAR
        language: Arabic
        description: المملكة العربية السعودية هي دولة عربية تقع في شبه الجزيرة العربية في جنوب غرب آسيا، وتعد أكبر دول الشرق الأوسط مساحة
        descText: اكتشف جمال المملكة العربية السعودية مع باقاتنا السياحية المميزة
        favTime: ["الصباح الباكر", "المساء"]
        favMonth: ["الخريف", "الشتاء", "الربيع"]
        isActive: true
        images: 
          - https://res.cloudinary.com/zahabwaawda/image/upload/v1684567890/countries/saudi-arabia-1.jpg
          - https://res.cloudinary.com/zahabwaawda/image/upload/v1684567890/countries/saudi-arabia-2.jpg
        imageCover: https://res.cloudinary.com/zahabwaawda/image/upload/v1684567890/countries/saudi-arabia-cover.jpg
        slug: saudi-arabia
        alt: صورة المملكة العربية السعودية
        cities: []
        createdBy: 6472f8b8ef4f160023ed47fe
        updatedBy: 6472f8b8ef4f160023ed47fe
        createdAt: 2023-05-28T10:15:30.000Z
        updatedAt: 2023-05-28T12:30:45.000Z
    
    CountryCreateRequest:
      type: object
      required:
        - name
        - continent
      properties:
        name:
          type: string
        code:
          type: string
        continent:
          type: string
        currency:
          type: string
        language:
          type: string
        description:
          type: string
        descText:
          type: string
        favTime:
          type: array
          items:
            type: string
        favMonth:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            type: string
        imageCover:
          type: string
          format: binary
        alt:
          type: string
        seo:
          $ref: '#/components/schemas/SEO'
    
    # City Schemas
    City:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          example: Paris
        country:
          $ref: '#/components/schemas/Country'
        description:
          type: string
        descText:
          type: string
        coordinates:
          type: object
          properties:
            lat:
              type: number
              example: 48.8566
            lng:
              type: number
              example: 2.3522
        favTime:
          type: array
          items:
            type: string
        favMonth:
          type: array
          items:
            type: string
        imageCover:
          type: string
        images:
          type: array
          items:
            type: string
        slug:
          type: string
        alt:
          type: string
        seo:
          $ref: '#/components/schemas/SEO'
        createdBy:
          type: string
        updatedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    CityCreateRequest:
      type: object
      required:
        - name
        - country
        - description
      properties:
        name:
          type: string
        country:
          type: string
          description: ID of the country
        description:
          type: string
        descText:
          type: string
        coordinates:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
        favTime:
          type: array
          items:
            type: string
        favMonth:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            type: string
        imageCover:
          type: string
          format: binary
        alt:
          type: string
        seo:
          $ref: '#/components/schemas/SEO'
    
    # Hotel Schemas
    Hotel:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        country:
          $ref: '#/components/schemas/Country'
        city:
          $ref: '#/components/schemas/City'
        rating:
          type: number
          minimum: 0
          maximum: 5
        category:
          type: string
        roomNumber:
          type: integer
        roomType:
          type: string
        description:
          type: string
        descText:
          type: string
        isActive:
          type: boolean
          default: true
        phone:
          type: string
        email:
          type: string
          format: email
        website:
          type: string
        address:
          type: string
        price:
          type: object
          properties:
            min:
              type: string
            max:
              type: string
        imageCover:
          type: string
        images:
          type: array
          items:
            type: string
        slug:
          type: string
        alt:
          type: string
        seo:
          $ref: '#/components/schemas/SEO'
        createdBy:
          type: string
        updatedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    HotelCreateRequest:
      type: object
      required:
        - name
        - country
        - city
        - address
      properties:
        name:
          type: string
        country:
          type: string
          description: ID of the country
        city:
          type: string
          description: ID of the city
        rating:
          type: number
          minimum: 0
          maximum: 5
        category:
          type: string
        roomNumber:
          type: integer
        roomType:
          type: string
        description:
          type: string
        descText:
          type: string
        isActive:
          type: boolean
        phone:
          type: string
        email:
          type: string
          format: email
        website:
          type: string
        address:
          type: string
        price:
          type: object
          properties:
            min:
              type: string
            max:
              type: string
        imageCover:
          type: string
          format: binary
        images:
          type: array
          items:
            type: string
        alt:
          type: string
        seo:
          $ref: '#/components/schemas/SEO'
    
    # Package Schemas
    PackageHeader:
      type: object
      properties:
        dayNumber:
          type: number
          minimum: 1
        nights:
          type: number
          minimum: 0
        location:
          type: string
          description: Country ID

    PackageItinerary:
      type: object
      properties:
        day:
          type: number
          minimum: 1
        title:
          type: string
        description:
          type: string

    Package:
      type: object
      properties:
        _id:
          type: string
          example: 647package123abc456789012680
          description: Unique package identifier
        name:
          type: string
          example: رحلة العمرة المميزة - 7 أيام
          description: Package name (supports Arabic)
        price:
          type: number
          example: 2500
          description: Package price in local currency
        rate:
          type: number
          default: 0
          example: 4.8
          description: Package rating (0-5 scale)
        header:
          $ref: '#/components/schemas/PackageHeader'
        packageType:
          $ref: '#/components/schemas/PackageType'
        itinerary:
          type: array
          items:
            $ref: '#/components/schemas/PackageItinerary'
          example:
            - day: 1
              title: الوصول إلى مكة المكرمة
              description: استقبال في المطار والانتقال إلى الفندق
            - day: 2
              title: أداء العمرة
              description: أداء مناسك العمرة مع مرشد متخصص
        includes:
          type: array
          items:
            type: string
          example: ["تذاكر الطيران", "الإقامة في فندق 5 نجوم", "وجبات الطعام", "النقل والمواصلات"]
          description: Services included in the package
        excludes:
          type: array
          items:
            type: string
          example: ["التأشيرة", "التأمين الصحي", "المصروف الشخصي"]
          description: Services not included in the package
        country:
          $ref: '#/components/schemas/Country'
        city:
          $ref: '#/components/schemas/City'
        imageCover:
          type: string
          example: https://res.cloudinary.com/zahabwaawda/image/upload/v1684567890/packages/umrah-package-cover.jpg
          description: Main package cover image
        images:
          type: array
          items:
            type: string
          example:
            - https://res.cloudinary.com/zahabwaawda/image/upload/v1684567890/packages/umrah-1.jpg
            - https://res.cloudinary.com/zahabwaawda/image/upload/v1684567890/packages/umrah-2.jpg
          description: Additional package images
        description:
          type: string
          example: رحلة العمرة المميزة تشمل الإقامة في أفضل الفنادق القريبة من الحرم مع خدمات متكاملة
          description: Detailed package description
        descText:
          type: string
