  parameters:
    IdPathParameter:
      name: id
      in: path
      required: true
      description: Resource ID
      schema:
        type: string
        example: 507f1f77bcf86cd799439011
    
    SlugPathParameter:
      name: slug
      in: path
      required: true
      description: Resource slug
      schema:
        type: string
        example: luxury-nile-tour
    
    PageQueryParameter:
      name: page
      in: query
      required: false
      description: Page number for pagination
      schema:
        type: integer
        minimum: 1
        default: 1
    
    LimitQueryParameter:
      name: limit
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

    SortQueryParameter:
      name: sort
      in: query
      required: false
      description: Sort field (prefix with - for descending order)
      schema:
        type: string
        example: -createdAt

    FieldsQueryParameter:
      name: fields
      in: query
      required: false
      description: Fields to include in response (comma-separated)
      schema:
        type: string
        example: name,price,description

    FilterQueryParameter:
      name: filter
      in: query
      required: false  
      description: Filter conditions (e.g., isActive=true, price[gte]=100)
      schema:
        type: string

  responses:
    UnauthorizedError:
      description: Unauthorized access - Invalid or missing authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing_token:
              summary: Missing authentication token
              value:
                status: error
                message: "You are not logged in! Please log in to get access"
                error:
                  name: UnauthorizedError
                  code: 401
            invalid_token:
              summary: Invalid or expired token
              value:
                status: error
                message: "Invalid token. Please log in again"
                error:
                  name: JsonWebTokenError
                  code: 401
    
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_found:
              summary: Resource not found
              value:
                status: error
                message: "Resource not found"
    
    ValidationError:
      description: Validation failed - Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation_error:
              summary: Field validation failed
              value:
                status: error
                message: "Validation failed"
                error:
                  name: ValidationError
                  code: 400
                  details:
                    - field: email
                      message: Valid email is required
                    - field: password
                      message: Password must be at least 6 characters
            required_fields:
              summary: Missing required fields
              value:
                status: error
                message: "Required fields are missing"
                error:
                  name: ValidationError
                  code: 400
                  details:
                    - field: name
                      message: Name is required
                    - field: country
                      message: Country is required

    ForbiddenError:
